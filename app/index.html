<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP Invoice Reporting Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: white; padding: 24px 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    header h1 { margin: 0; color: #0a6ed1; font-size: 38px; }
    header p { margin-top: 10px; font-size: 16px; }
    .container { padding: 24px 32px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .card, .section { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { margin: 0 0 10px 0; color: #555; font-size: 16px; }
    .card .value { font-size: 28px; font-weight: bold; color: #0a6ed1; }
    .section { margin-bottom: 24px; }
    .section h2 { margin-top: 0; color: #0a6ed1; }
    .actions a { display: inline-block; margin-right: 12px; margin-bottom: 10px; color: #0a6ed1; text-decoration: none; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #eef4fb; }
    .status-paid { color: green; font-weight: bold; }
    .status-pending { color: red; font-weight: bold; }
    @media (max-width: 900px) {
      .cards { grid-template-columns: 1fr; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📊 SAP Invoice Reporting Dashboard</h1>
    <p>Built using SAP CAP project structure</p>
  </header>

  <div class="container">
    <div class="cards">
      <div class="card">
        <h3>Total Invoices</h3>
        <div class="value" id="totalInvoices">0</div>
      </div>
      <div class="card">
        <h3>Total Revenue</h3>
        <div class="value" id="totalRevenue">0</div>
      </div>
      <div class="card">
        <h3>Paid Invoices</h3>
        <div class="value" id="paidInvoices">0</div>
      </div>
    </div>

    <div class="section actions">
      <h2>Actions</h2>
      <a href="/create-invoice.html">Create New Invoice</a>
    </div>

    <div class="section">
      <h2>Invoice Table</h2>
      <table id="invoiceTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Total</th>
            <th>Status</th>
            <th>Region</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="section">
      <h2>Revenue by Region</h2>
      <canvas id="regionChart"></canvas>
    </div>
  </div>

  <script>
    const seedData = [
      { ID: 1, customerName: "Claire Gute", invoiceDate: "2016-11-08", amount: 261.96, tax: 47.15, total: 309.11, paymentStatus: "PENDING", customerRegion: "South", invoiceCategory: "Furniture" },
      { ID: 2, customerName: "Claire Gute", invoiceDate: "2016-11-08", amount: 731.94, tax: 131.75, total: 863.69, paymentStatus: "PENDING", customerRegion: "South", invoiceCategory: "Furniture" },
      { ID: 3, customerName: "Darrin Van Huff", invoiceDate: "2016-12-06", amount: 14.62, tax: 2.63, total: 17.25, paymentStatus: "PENDING", customerRegion: "West", invoiceCategory: "Office Supplies" },
      { ID: 4, customerName: "Sean O'Donnell", invoiceDate: "2015-10-11", amount: 957.58, tax: 172.36, total: 1129.94, paymentStatus: "PENDING", customerRegion: "South", invoiceCategory: "Furniture" },
      { ID: 5, customerName: "Sean O'Donnell", invoiceDate: "2015-10-11", amount: 22.37, tax: 4.03, total: 26.39, paymentStatus: "PENDING", customerRegion: "South", invoiceCategory: "Office Supplies" },
      { ID: 6, customerName: "Brosina Hoffman", invoiceDate: "2014-09-06", amount: 48.86, tax: 8.79, total: 57.65, paymentStatus: "PENDING", customerRegion: "West", invoiceCategory: "Furniture" },
      { ID: 7, customerName: "Brosina Hoffman", invoiceDate: "2014-09-06", amount: 7.28, tax: 1.31, total: 8.59, paymentStatus: "PENDING", customerRegion: "West", invoiceCategory: "Office Supplies" },
      { ID: 8, customerName: "Brosina Hoffman", invoiceDate: "2014-09-06", amount: 907.15, tax: 163.29, total: 1070.44, paymentStatus: "PAID", customerRegion: "West", invoiceCategory: "Technology" },
      { ID: 9, customerName: "Brosina Hoffman", invoiceDate: "2014-09-06", amount: 18.50, tax: 3.33, total: 21.83, paymentStatus: "PENDING", customerRegion: "West", invoiceCategory: "Office Supplies" },
      { ID: 10, customerName: "Brosina Hoffman", invoiceDate: "2014-09-06", amount: 114.90, tax: 20.68, total: 135.58, paymentStatus: "PENDING", customerRegion: "West", invoiceCategory: "Office Supplies" }
    ];

    function getInvoices() {
      const saved = localStorage.getItem("invoiceData");
      if (saved) return JSON.parse(saved);
      localStorage.setItem("invoiceData", JSON.stringify(seedData));
      return seedData;
    }

    function renderDashboard() {
      const invoices = getInvoices();

      document.getElementById('totalInvoices').innerText = invoices.length;
      document.getElementById('totalRevenue').innerText =
        invoices.reduce((sum, inv) => sum + Number(inv.total || 0), 0).toFixed(2);
      document.getElementById('paidInvoices').innerText =
        invoices.filter(inv => inv.paymentStatus === 'PAID').length;

      const tbody = document.querySelector('#invoiceTable tbody');
      tbody.innerHTML = '';
      invoices.forEach(inv => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${inv.ID}</td>
          <td>${inv.customerName}</td>
          <td>${inv.invoiceDate}</td>
          <td>${inv.amount}</td>
          <td>${inv.total}</td>
          <td class="${inv.paymentStatus === 'PAID' ? 'status-paid' : 'status-pending'}">${inv.paymentStatus}</td>
          <td>${inv.customerRegion}</td>
          <td>${inv.invoiceCategory}</td>
        `;
        tbody.appendChild(tr);
      });

      const regionMap = {};
      invoices.forEach(inv => {
        const region = inv.customerRegion || 'Unknown';
        regionMap[region] = (regionMap[region] || 0) + Number(inv.total || 0);
      });

      const labels = Object.keys(regionMap);
      const values = Object.values(regionMap);

      const ctx = document.getElementById('regionChart');
      if (window.regionChartInstance) window.regionChartInstance.destroy();
      window.regionChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{ label: 'Revenue', data: values }]
        },
        options: { responsive: true }
      });
    }

    renderDashboard();
  </script>
</body>
</html>
